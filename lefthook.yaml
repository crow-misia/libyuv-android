# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

assert_lefthook_installed: true
skip_lfs: true

commit-msg:
  parallel: true
  commands:
    lint:
      run: mise exec -- commitlint --color false --edit {1}

pre-commit:
  parallel: false
  commands:
    gitleaks:
      tags: security
      run: mise exec -- gitleaks git --pre-commit --staged --no-color --no-banner --verbose
